<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft graphite mark: lab vessel + two learners as rising points -->
  <defs>
    <linearGradient id="bg" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a5a60"/>
      <stop offset="1" stop-color="#3a3a3e"/>
    </linearGradient>
    <linearGradient id="metal" x1="20" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#c8c8ce"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Vessel outline -->
  <path
    d="M24 16h16v6.5c0 1.2-.4 2.3-1.2 3.2L35 30v12.5c0 2.5-2 4.5-4.5 4.5h-1c-2.5 0-4.5-2-4.5-4.5V30l-3.8-4.3c-.8-.9-1.2-2-1.2-3.2V16z"
    stroke="url(#metal)"
    stroke-width="2.4"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Neck highlight -->
  <path d="M27 16h10" stroke="#ececef" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Two points (pair) rising -->
  <circle cx="28.5" cy="40" r="2.4" fill="#ececef"/>
  <circle cx="35.5" cy="35" r="2.4" fill="#d2d2d7"/>
  <!-- Soft ascending path -->
  <path
    d="M22 48c6-2 10-7 14-12s8-8 14-9"
    stroke="#b0b0b6"
    stroke-width="1.8"
    stroke-linecap="round"
    fill="none"
    opacity="0.85"
  />
</svg>
